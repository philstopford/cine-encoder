name: Release

on:
  push:
    tags:
      - 'v*'
      - 'alpha*'
      - 'beta*'

jobs:
  release:
    needs: [build-linux, build-ubuntu, build-arch, build-windows]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/cine-encoder-linux/Cine_Encoder-*-x86_64.AppImage
          artifacts/cine-encoder-ubuntu/cine-encoder-*-ubuntu-amd64.deb
          artifacts/cine-encoder-arch/cine-encoder-*-arch-x86_64.pkg.tar.zst
          artifacts/cine-encoder-windows/cine-encoder-*-windows-x64.zip
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}